[project]
name = "llm-evalkit"
version = "0.1.0"
description = "Deterministic evaluation for RAG / LLM question answering: fact-based scoring, confidence intervals, paired tests, held-out discipline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evalkit = "evalkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
